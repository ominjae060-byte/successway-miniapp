const koreaBody="2026년 12월 한국 증시 투자 핵심 브리핑\n작성 기준: 2026년 11월 25일 · 한국시간(KST)\n\n2026년 마지막 거래월인 12월은 증시안정 대책의 실효성, 외국인 수급 회복, 반도체 업황, 국내 선물·옵션 동시만기, 연말 배당 및 기관 결산이 핵심 변수입니다.\n특히 12월 10~11일과 12월 28~30일은 수급 변화와 변동성 확대에 주의해야 할 구간입니다.\n\n━━━━━━━━━━━━━━━━━━\n1. 12월 주요 증시 일정\n━━━━━━━━━━━━━━━━━━\n12/1(화) ★★★★\n한국 11월 수출입동향\n\n12/2(수) ★★★★\n한국 소비자물가지수(CPI)\n\n12/4(금) ★★★★★\n미국 비농업 고용보고서\n\n12/8(화) ★★★\n한국 국제수지 발표\n\n12/9(수) ★★★\n한국 3분기 국민소득 잠정치\n\n12/10(목) ★★★★★\n미국 FOMC 금리 결정\n국내 선물·옵션 동시만기\n미국 소비자물가지수(CPI)\n\n12/11(금) ★★★★★\n코스피200·코스닥150·KRX300 정기변경 적용\n\n12/14~15 ★★★\nG20 정상회의\n\n12/15(화) ★★★\n한국 수출입물가지수\n\n12/16(수) ★★★\n한국 11월 고용동향\n\n12/17(목) ★★★★\n유럽중앙은행(ECB) 금리 결정\n\n12/18(금) ★★★★★\n일본은행(BOJ) 금리 결정\n\n12/18(금) ★★★★\n미국 선물·옵션 동시만기\n\n12/23(수) ★★★★\n미국 PCE 물가지수·GDP\n\n12/25(금)\n성탄절 증시 휴장\n\n12/28(월) ★★★★★\n대주주 양도세 관련 매매 기준일\n\n12/29(화) ★★★★\n연말 결산법인 배당락일\n\n12/30(수) ★★★★\n국내 산업활동동향·증시 폐장 예정\n\n12/31(목) ★★★\n국내 소비자물가지수·연말 휴장 예정\n\n※ 한국은행의 정례 기준금리 결정회의는 12월에 예정되어 있지 않습니다. 일정은 변경될 수 있습니다.\n\n━━━━━━━━━━━━━━━━━━\n2. 국내 증시 주요 정책 이벤트\n━━━━━━━━━━━━━━━━━━\n■ 증권시장안정펀드\n실제 자금 투입 여부와 집행 규모, 외국인 매도세 완화 여부가 핵심입니다. 현재는 가동을 위한 준비 단계입니다.\n\n■ 상장기업 자사주 매수 한도 완화\n2026년 11월 24일부터 2027년 2월 23일까지 적용됩니다. 실제 기업들의 자사주 매입 확대 여부에 주목해야 합니다.\n\n■ 불법 공매도 집중 감시\n불법 공매도에 대한 특별 집중 감시가 진행됩니다. 공매도 전면 금지와는 구분해야 합니다.\n\n■ 반도체 산업 경쟁력 강화 기본계획\n12월 말 공개 예상. 반도체 투자 지원과 소부장 산업 육성 정책에 주목할 필요가 있습니다.\n\n■ 2027년 경제성장전략\n12월 말 발표 예상. AI·반도체·전력·첨단산업 관련 정책과 예산 지원 방향이 주요 관심사입니다.\n\n━━━━━━━━━━━━━━━━━━\n3. 12월 주요 지수 편입·편출 종목\n━━━━━━━━━━━━━━━━━━\n12월 10일 종가 부근에는 ETF 추종 자금의 리밸런싱이 진행될 예정이며, 11일부터 변경된 지수가 적용됩니다.\n\n코스피200\n신규 편입 주요 종목: 두산퓨얼셀, 대덕전자, 가온전선, 일진전기, PI첨단소재\n편출 주요 종목: 한샘, OCI, 대한유화, SK아이이테크놀로지\n\n코스닥150\n신규 편입 주요 종목: GST, 티엘비, 샘씨엔에스, 대한광통신, 리브스메드\n편출 주요 종목: 엔켐, 유진로봇, 가온칩스, 젬백스\n\nKRX300\n신규 편입 주요 종목: 후성, 케이씨텍, 티에스이, 기가비스, 브이엠\n편출 주요 종목: CJ ENM, 대한조선, 클로봇, 루닛\n\n편입 종목은 패시브 매수세, 편출 종목은 패시브 매도세가 발생할 수 있으나 선반영 가능성도 고려해야 합니다.\n\n━━━━━━━━━━━━━━━━━━\n4. 12월 주요 관심 섹터\n━━━━━━━━━━━━━━━━━━\n• 반도체·소부장 : 마이크론 실적, D램·낸드 가격, 반도체 규제, 국내 산업 지원 정책\n• 전력설비·원전 : 제12차 전력수급기본계획 정부안 공개 예상, AI 데이터센터 전력 수요\n• 제약·바이오 : ASH 및 2027년 1월 JP모건 헬스케어 콘퍼런스 기대감\n• 로봇·AI : 2027년 1월 CES를 앞둔 신기술 공개 기대감과 정책 지원\n• 소비재·화장품 : 연말 소비 시즌, 중국 내수 회복 여부 및 수출 실적\n• 금융·고배당·자사주 관련주 : 주주환원 정책, 자사주 매입 확대, 배당기준일 및 밸류업 정책\n\n━━━━━━━━━━━━━━━━━━\n5. 12월 증시 상승·하락 변수\n━━━━━━━━━━━━━━━━━━\n📈 상승 요인\n• 증안펀드 실제 집행\n• 외국인·기관 동반 매수\n• 반도체 업황 개선\n• 연준의 완화적 통화정책\n• 기업 자사주 매입 확대\n• 연말 산타랠리\n\n📉 하락 요인\n• 외국인 매도세 지속\n• 원·달러 환율 상승\n• 반도체 규제 불확실성\n• 미국 추가 금리 인상 부담\n• 대주주 양도세 회피 매물\n• 기관 결산성 매도\n\n━━━━━━━━━━━━━━━━━━\n6. 12월 주차별 투자 대응 전략\n━━━━━━━━━━━━━━━━━━\n1주차 | 수출·물가·미국 고용\n외국인 수급 확인\n\n2주차 | FOMC·동시만기·리밸런싱\n비중 조절 및 변동성 경계\n\n3주차 | 글로벌 통화정책·반도체 실적\n주도 섹터 변화 확인\n\n4주차 | 성탄절·연말 거래량 감소\n무리한 추격 매수 자제\n\n5주차 | 양도세·배당락·폐장\n현금 확보 및 결산 매물 주의\n\n━━━━━━━━━━━━━━━━━━\n📢 텔레그램 전달용 핵심 요약\n━━━━━━━━━━━━━━━━━━\n🇰🇷 2026년 12월 국내 증시 투자 핵심 전망\n\n📅 주요 증시 일정\n▪ 12/01 한국 수출입동향\n▪ 12/04 미국 비농업 고용보고서\n▪ 12/10 FOMC 금리 결정\n▪ 12/10 국내 선물·옵션 동시만기\n▪ 12/10 미국 CPI 발표\n▪ 12/11 코스피200·코스닥150 정기변경\n▪ 12/18 일본은행 금리 결정\n▪ 12/23 미국 PCE 물가지수\n▪ 12/25 성탄절 휴장\n▪ 12/28 대주주 양도세 관련 매물 주의\n▪ 12/29 배당락일(해당 기업)\n▪ 12/30 국내 증시 폐장 예정\n▪ 12/31 연말 휴장 예정\n\n🚨 12월 핵심 투자 포인트\n✔ 증안펀드 실제 가동 여부\n✔ 외국인·기관 수급 회복\n✔ 상장기업 자사주 매입 확대\n✔ 반도체 산업 지원 정책\n✔ 2027년 경제성장전략 발표\n✔ 연말 기관 결산 및 배당 수급\n✔ 산타랠리 출현 여부\n\n🎯 주요 관심 섹터\n#반도체 #소부장 #전력설비\n#원전 #제약바이오 #로봇\n#AI #소비재 #고배당 #자사주\n\n12월은 주요 경제 이벤트와 정책 발표, 연말 수급 변화가 집중되는 시기입니다. 단순한 낙폭 과대 종목보다 실질적인 수급 유입과 추세 전환이 확인되는 종목을 선별하는 것이 중요합니다.\n\n⚠️ 무리한 비중 확대보다는 현금 비중과 리스크 관리에 집중하며 2026년 마지막 거래월을 안정적으로 마무리하겠습니다.\n\n「성공을 위한 길」\n\n※ 2026년 11월 25일 공개 자료 기준입니다. 정책 발표와 기업 실적, 연말 폐장 관련 세부 일정은 변경될 수 있습니다. 관심 섹터는 이벤트에 따른 관찰 대상이며 상승을 보장하지 않습니다.\n※ 투자 판단의 참고자료이며 수익을 보장하지 않습니다.";
let featureArticleIndex=0;let tab='home',category='',slide=0,q='';const root=document.getElementById('content');let favorites=new Set(JSON.parse(localStorage.getItem('sw-favs')||'[]'));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function saved(){localStorage.setItem('sw-favs',JSON.stringify([...favorites]))}function list(rows){return rows.length?`<div class="items">${rows.map(p=>`<div class="item"><div class="meta">${esc(cats.find(c=>c.id===p.cat)?.name||'')} · ${esc(p.date)}</div><strong>${esc(p.title)}</strong><p>${esc(p.desc)}</p><div style="display:flex;gap:14px;margin-top:11px"><button onclick="favorite(${p.id})" style="border:0;background:none;color:#b28b47;padding:0">${favorites.has(p.id)?'★ 저장됨':'☆ 보관하기'}</button>${p.id===4?`<button class="detail-open" onclick="openSchedule()">📖 12월 전체 일정 보기 →</button>`:p.id===5?`<button class="detail-open" onclick="openNasdaq()">📖 나스닥 브리핑 전체 보기 →</button>`:p.id===6?`<button class="detail-open" onclick="openHangseng()">📖 항셍 브리핑 전체 보기 →</button>`:p.id===3?`<button class="detail-open" onclick="openStocks()">📖 국내증시 브리핑 전체 보기 →</button>`:(p.url?`<a target="_blank" rel="noopener" href="${esc(p.url)}" style="color:#315c8c;font-size:12px">원문 보기 ↗</a>`:'<span style="font-size:11px;color:#9a9da1">원문 링크 미등록</span>')}</div></div>`).join('')}</div>`:'<div class="empty">표시할 자료가 없습니다.</div>'}
window.openHangseng=()=>{tab='hangseng-detail';q='';document.getElementById('search').value='';render();window.scrollTo(0,0)};window.openNasdaq=()=>{tab='nasdaq-detail';q='';document.getElementById('search').value='';render();window.scrollTo(0,0)};window.openStocks=()=>{tab='stocks-detail';q='';document.getElementById('search').value='';render();window.scrollTo(0,0)};window.openSchedule=()=>{tab='detail';q='';document.getElementById('search').value='';render();window.scrollTo(0,0)};window.favorite=id=>{favorites.has(id)?favorites.delete(id):favorites.add(id);saved();render()};window.pick=id=>{category=id;tab='category';q='';document.getElementById('search').value='';render()};window.go=t=>{tab=t;category='';q='';document.getElementById('search').value='';render()};window.changeSlide=n=>{slide=(n+featureSlides.length)%featureSlides.length;render();window.lastSlideChange=Date.now()};

setInterval(()=>{if(tab==='home'&&!q&&!document.hidden&&Date.now()-window.lastSlideChange>=3000){slide=(slide+1)%featureSlides.length;window.lastSlideChange=Date.now();render()}},500);
