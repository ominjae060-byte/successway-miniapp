<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>성공을 위한 길 | 정보센터</title><style>
:root{--navy:#101f35;--navy2:#1c3453;--gold:#d9b66c;--paper:#f7f4ed;--ink:#1b283b;--line:#e8dfd0}*{box-sizing:border-box}body{margin:0;background:#dde3e9;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer} .app{max-width:440px;margin:auto;background:var(--paper);min-height:100dvh;padding-bottom:98px;box-shadow:0 2px 30px #0002}.top{background:linear-gradient(135deg,#0c1b30,#294669);color:white;padding:19px 18px 20px;position:relative;overflow:hidden}.top:after{content:'✦';position:absolute;right:-25px;top:0;font-size:145px;color:#fff1;pointer-events:none}.micro{color:#e1c58c;font-size:11px;letter-spacing:1.5px;font-weight:750}.brand{display:flex;align-items:center;gap:12px;position:relative}.mark{border:2px solid var(--gold);border-radius:50%;height:54px;width:54px;display:grid;place-items:center;background:radial-gradient(circle at 50% 75%,#a8782a,#203d56 65%);font-size:26px;flex-shrink:0}.brand h1{font-size:24px;margin:3px 0;font-weight:850;letter-spacing:-1.1px}.brand p{margin:0;color:#d7e2ed;font-size:12px}.tools{display:flex;gap:7px;margin-top:17px;position:relative}.tools button{border:1px solid #ffffff50;color:white;background:#ffffff18;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:700}.tools button:first-child{background:var(--gold);color:#15243a;border:0;flex:1}.searchwrap{background:white;margin:-1px 0 0;padding:12px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}.searchwrap input{background:#f3f4f5;border:0;outline:0;border-radius:12px;padding:12px;width:100%;font-size:13px}.main{padding:16px 14px}.heading{display:flex;align-items:center;justify-content:space-between;margin:3px 0 13px}.heading h2{margin:0;font-size:16px}.heading span{font-size:11px;color:#756c5f}.hero{background:linear-gradient(125deg,#294e64,#476e69);color:white;min-height:174px;border-radius:22px;display:flex;gap:12px;padding:21px;box-shadow:0 8px 17px #263e5020}.hero .symbol{font-size:48px;align-self:center;border-radius:18px;background:#ffffff18;padding:12px}.hero .content{flex:1}.hero .tag{font-size:10px;color:#ffe7a4;font-weight:800}.hero h3{font-size:19px;line-height:1.45;margin:10px 0}.hero p{font-size:11px;opacity:.85}.hero button{border:0;background:white;color:#23485c;padding:8px 13px;border-radius:9px;font-size:12px;font-weight:800}.dots{text-align:center;padding:12px 0;color:#b6a58e}.dots button{width:8px;height:8px;border:0;background:#d6c9b6;border-radius:50%;padding:0;margin:0 4px}.dots button.active{width:22px;border-radius:6px;background:#bf9851}.banner{border:1px solid #d3b46a;background:linear-gradient(105deg,#fbf1dc,#fff9ec);border-radius:19px;padding:17px;margin:4px 0 20px;display:flex;align-items:center;gap:13px}.banner .big{font-size:34px}.banner strong{font-size:14px}.banner p{font-size:11px;color:#796845;margin:5px 0 0}.section{margin:16px 0}.section h2{font-size:16px;margin:0 0 12px}.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;text-align:left;color:white;border-radius:16px;padding:16px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}.tile i{font-size:24px;font-style:normal}.tile strong{font-size:15px}.tile small{opacity:.8;font-size:10px}.nasdaq{background:#1c618e}.hangseng{background:#198071}.stocks{background:#70579e}.schedule{background:#596679}.items{display:grid;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;text-align:left;width:100%}.item .meta{color:#aa8246;font-size:11px;font-weight:700}.item strong{display:block;font-size:14px;margin:6px 0}.item p{font-size:12px;line-height:1.5;color:#657185;margin:0}.back{background:none;border:0;padding:0 0 18px;color:#52647b;font-size:13px;font-weight:750}.category-title{font-size:21px;margin:0 0 5px}.category-desc{color:#67778b;font-size:12px;line-height:1.6;margin:0 0 18px}.empty{color:#737a84;text-align:center;padding:55px 8px;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:#fffcf6;border-top:1px solid #e8dcc5;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px max(10px,env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:transparent;color:#7f8490;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:11px}.bottom button .ico{font-size:23px}.bottom button.active{color:#895f19;background:#f9eacb;font-weight:800}.notice{background:#fffaf0;border:1px solid #ead8b3;padding:11px;border-radius:12px;font-size:11px;line-height:1.6;color:#78674d;margin-top:18px}.contact{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));display:flex;gap:8px;z-index:5}.contact a{text-align:center;flex:1;border-radius:12px;padding:12px;text-decoration:none;font-size:12px;font-weight:800;color:#fff;background:#224763;box-shadow:0 4px 12px #0002}.contact a:last-child{background:#0d7b75}.hidden{display:none!important}</style></head><body><div class="app"><header class="top"><div class="micro">OFFICIAL MARKET COMMUNITY</div><div class="brand"><div class="mark">🚩</div><div><h1>성공을 위한 길</h1><p>주식 · 지수 정보센터 & 자료실</p></div></div><div class="tools"><button id="intro">✨ 이용안내</button><button id="refresh">↻ 새로고침</button></div></header><div class="searchwrap"><span>🔎</span><input id="search" placeholder="자료 제목이나 키워드 검색" aria-label="자료 검색"></div><main class="main" id="content"></main><div class="contact"><a href="https://t.me/leehskr" target="_blank" rel="noopener">✉️ 1:1 상담 문의</a></div><nav class="bottom"><button data-tab="home" class="active"><span class="ico">⌂</span>홈</button><button data-tab="library"><span class="ico">📚</span>자료실</button><button data-tab="schedule"><span class="ico">📅</span>시장 일정</button><button data-tab="my"><span class="ico">⭐</span>MY</button></nav></div><script>
const cats=[{id:'nasdaq',name:'나스닥 정보',icon:'📈',cls:'nasdaq',desc:'나스닥 관련 공지 및 대응 자료'},{id:'hangseng',name:'항셍 정보',icon:'📊',cls:'hangseng',desc:'항셍 관련 공지 및 대응 자료'},{id:'stocks',name:'국내 주식',icon:'🇰🇷',cls:'stocks',desc:'국내 주식 시장 정보와 자료'},{id:'schedule',name:'시장 일정',icon:'🗓️',cls:'schedule',desc:'경제지표 및 주요 일정 공지'}];
// 아래 배열의 내용은 모두 예시입니다. 실제 운영 공지로 교체하세요.
const posts=[{id:1,cat:'nasdaq',date:'예시 자료',title:'나스닥 장전 브리핑',desc:'주요 지수 흐름 및 확인할 구간을 정리하는 게시물 예시입니다.',url:''},{id:2,cat:'hangseng',date:'예시 자료',title:'항셍 시장 체크포인트',desc:'당일 시장 대응 정보를 올리는 게시물 예시입니다.',url:''},{id:3,cat:'stocks',date:'예시 자료',title:'국내증시 주요 업종 정리',desc:'국내 주식 공지 또는 그룹 게시물 링크를 연결하세요.',url:''},{id:4,cat:'schedule',date:'예시 자료',title:'이번 주 주요 경제 일정',desc:'경제지표 발표 및 이벤트 일정 공지 예시입니다.',url:''}];
let tab='home',category='',slide=0,q='';const root=document.getElementById('content');let favorites=new Set(JSON.parse(localStorage.getItem('sw-favs')||'[]'));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function saved(){localStorage.setItem('sw-favs',JSON.stringify([...favorites]))}function list(rows){return rows.length?`<div class="items">${rows.map(p=>`<div class="item"><div class="meta">${esc(cats.find(c=>c.id===p.cat)?.name||'')} · ${esc(p.date)}</div><strong>${esc(p.title)}</strong><p>${esc(p.desc)}</p><div style="display:flex;gap:14px;margin-top:11px"><button onclick="favorite(${p.id})" style="border:0;background:none;color:#b28b47;padding:0">${favorites.has(p.id)?'★ 저장됨':'☆ 보관하기'}</button>${p.url?`<a target="_blank" rel="noopener" href="${esc(p.url)}" style="color:#315c8c;font-size:12px">원문 보기 ↗</a>`:'<span style="font-size:11px;color:#9a9da1">원문 링크 미등록</span>'}</div></div>`).join('')}</div>`:'<div class="empty">표시할 자료가 없습니다.</div>'}
window.favorite=id=>{favorites.has(id)?favorites.delete(id):favorites.add(id);saved();render()};window.pick=id=>{category=id;tab='category';q='';document.getElementById('search').value='';render()};window.go=t=>{tab=t;category='';q='';document.getElementById('search').value='';render()};window.changeSlide=n=>{slide=n;render()};function render(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab||(tab==='category'&&b.dataset.tab==='library')));if(q){let found=posts.filter(p=>(p.title+' '+p.desc+' '+cats.find(c=>c.id===p.cat)?.name).toLowerCase().includes(q.toLowerCase()));root.innerHTML=`<div class="heading"><h2>🔎 검색 결과</h2><span>${found.length}건</span></div>${list(found)}`;return}
if(tab==='home'){let slides=[{tag:'SUCCESSWAY · MARKET GUIDE',title:'시장을 읽는 기준,\n흔들리지 않는 대응',sub:'성공을 위한 길 · 공식 자료실',sym:'🚩',cat:'nasdaq'},{tag:'INDEX MARKET',title:'나스닥 · 항셍\n지수 정보 한눈에',sub:'주제별 자료실에서 확인하세요',sym:'📈',cat:'hangseng'},{tag:'KOREA MARKET',title:'국내주식 주요 자료와\n시장 핵심 일정',sub:'주요 정보는 메뉴에서 확인하세요',sym:'🇰🇷',cat:'stocks'}],s=slides[slide];root.innerHTML=`<div class="heading"><h2>✦ 오늘의 추천 정보</h2><span>주제별 바로가기</span></div><div class="hero"><div class="symbol">${s.sym}</div><div class="content"><div class="tag">${s.tag}</div><h3>${s.title.replace('\n','<br>')}</h3><p>${s.sub}</p><button onclick="pick('${s.cat}')">자료실 보기 ↗</button></div></div><div class="dots">${slides.map((_,i)=>`<button class="${slide===i?'active':''}" onclick="changeSlide(${i})" aria-label="추천 ${i+1}"></button>`).join('')}</div><div class="banner"><div class="big">🏆</div><div><strong>정보를 모으고, 원칙을 지키는 투자</strong><p>성공을 위한 길 · 주제별 핵심 자료 아카이브</p></div></div><div class="section"><h2>📚 분야별 자료실</h2><div class="tilegrid">${cats.map(c=>`<button class="tile ${c.cls}" onclick="pick('${c.id}')"><i>${c.icon}</i><strong>${c.name}</strong><small>자료 확인하기 ↗</small></button>`).join('')}</div></div><div class="section"><h2>🗞️ 최근 등록 자료</h2>${list(posts.slice().reverse())}</div><div class="notice">현재 화면의 공지는 예시입니다. 실제 시장 정보와 연동되어 있지 않으며 관리자가 자료를 등록해야 합니다.</div>`;return}
if(tab==='library'){root.innerHTML=`<div class="heading"><h2>📚 주제별 자료실</h2><span>4개 분야</span></div><div class="tilegrid">${cats.map(c=>`<button class="tile ${c.cls}" onclick="pick('${c.id}')"><i>${c.icon}</i><strong>${c.name}</strong><small>${c.desc}</small></button>`).join('')}</div><div class="section"><h2>전체 자료</h2>${list(posts)}</div>`;return}
if(tab==='schedule'){let c=cats[3];root.innerHTML=`<h2 class="category-title">🗓️ 시장 일정</h2><p class="category-desc">경제지표, 주요 이벤트 및 일정 안내</p>${list(posts.filter(p=>p.cat==='schedule'))}`;return}
if(tab==='my'){root.innerHTML=`<h2 class="category-title">⭐ 나의 보관함</h2><p class="category-desc">이 브라우저에서 보관한 자료입니다.</p>${list(posts.filter(p=>favorites.has(p.id)))}`;return}
let c=cats.find(c=>c.id===category);root.innerHTML=`<button class="back" onclick="go('library')">← 자료실로 돌아가기</button><h2 class="category-title">${c.icon} ${c.name}</h2><p class="category-desc">${c.desc}</p>${list(posts.filter(p=>p.cat===category))}`}
document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));document.getElementById('search').addEventListener('input',e=>{q=e.target.value.trim();render()});document.getElementById('intro').addEventListener('click',()=>alert('이용안내\n\n1. 분야별 자료실에서 공지를 확인하세요.\n2. 검색창에서 제목 또는 주제를 검색하세요.\n3. 보관하기를 누르면 MY에서 확인할 수 있습니다.\n4. 1:1 상담은 하단 버튼으로 연결됩니다.'));document.getElementById('refresh').addEventListener('click',()=>location.reload());render();</script></body></html>
